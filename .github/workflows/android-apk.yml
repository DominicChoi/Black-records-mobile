name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Godot 4.3 Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          echo "Java SDK: ${JAVA_HOME}"
          test -x "${JAVA_HOME}/bin/java"
          test -x "${ANDROID_SDK_ROOT}/platform-tools/adb"
          test -d "${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-34"

      - name: Create installable debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "${{ runner.temp }}/blackrecords-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Black Records Debug,O=Black Records,C=KR"

      - name: Export Godot Android APK
        id: godot_export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/blackrecords-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true
          use_preset_export_path: true

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find . "$HOME/.local/share/godot/builds" -type f -name 'BlackRecords-v0.2.7.apk' -print -quit 2>/dev/null)"
          if [ -z "$APK" ]; then
            APK="$(find . "$HOME/.local/share/godot/builds" -type f -name '*.apk' -print -quit 2>/dev/null)"
          fi
          if [ -z "$APK" ]; then
            echo 'APK was not generated.' >&2
            find . -maxdepth 5 -type f | sort
            exit 1
          fi
          cp "$APK" dist/BlackRecords-v0.2.7-debug.apk

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: BlackRecords-Android-v0.2.7
          path: dist/BlackRecords-v0.2.7-debug.apk
          if-no-files-found: error
          retention-days: 30
