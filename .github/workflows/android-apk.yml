name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create installable debug keystore
        run: |
          keytool -genkeypair \
            -keystore "${{ runner.temp }}/blackrecords-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Black Records Debug,O=Black Records,C=KR"

      - name: Export Godot Android APK
        id: export
        uses: firebelley/godot-export@v7.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/blackrecords-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true
          use_preset_export_path: true

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find . -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo 'APK was not generated.' >&2
            find . -maxdepth 5 -type f | sort
            exit 1
          fi
          cp "$APK" dist/BlackRecords-v0.2.0-debug.apk
          ls -lh dist/BlackRecords-v0.2.0-debug.apk

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: BlackRecords-Android-v0.2.0
          path: dist/BlackRecords-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
